<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수능 과목 달력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: dark scoreboard. One loud move, the D-day number that fills red as the exam gets closer. Calendar tiles stay quiet until painted. */
  :root {
    --bg: #090b10;
    --panel: #12161f;
    --line: #232a3a;
    --ink: #f3f5fa;
    --muted: #7e889e;
    --red: #ff4338;
    --glow: rgba(255, 67, 56, .20);
    --pill: rgba(9, 11, 16, .78);
    --slash: rgba(243, 245, 250, .22);
    --slash-fill: rgba(0, 0, 0, .55);
    --c-math: #4db2ff;  --on-math: #06203a;
    --c-bio:  #4a74ff;  --on-bio:  #ffffff;
    --c-earth:#3ddc63;  --on-earth:#062a10;
    --c-eng:  #a766ff;  --on-eng:  #ffffff;
    --c-kor:  #ff9422;  --on-kor:  #381a00;
    --display: "Black Han Sans", "Noto Sans KR", sans-serif;
    --sans: "Noto Sans KR", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eceff5; --panel: #ffffff; --line: #d3d8e4; --ink: #0c1018; --muted: #5a647a;
      --red: #e5281d; --glow: rgba(229, 40, 29, .13); --pill: rgba(255, 255, 255, .86);
      --slash: rgba(12, 16, 24, .25); --slash-fill: rgba(255, 255, 255, .8);
      --c-math: #2b94f5; --c-bio: #2547c4; --c-earth: #1fae48; --c-eng: #7b3fd0; --c-kor: #ef760a;
      --on-math: #ffffff; --on-bio: #ffffff; --on-earth: #ffffff; --on-eng: #ffffff; --on-kor: #ffffff;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #eceff5; --panel: #ffffff; --line: #d3d8e4; --ink: #0c1018; --muted: #5a647a;
    --red: #e5281d; --glow: rgba(229, 40, 29, .13); --pill: rgba(255, 255, 255, .86);
    --slash: rgba(12, 16, 24, .25); --slash-fill: rgba(255, 255, 255, .8);
    --c-math: #2b94f5; --c-bio: #2547c4; --c-earth: #1fae48; --c-eng: #7b3fd0; --c-kor: #ef760a;
    --on-math: #ffffff; --on-bio: #ffffff; --on-earth: #ffffff; --on-eng: #ffffff; --on-kor: #ffffff;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(70% 38% at 12% 0%, var(--glow), transparent 70%);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 22px 44px;
    min-height: 100%;
  }
  .wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

  /* Header */
  .eyebrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .big {
    margin: 2px 0 0; font-family: var(--display); font-weight: 400; line-height: .9;
    font-size: clamp(110px, 34vw, 250px); letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .big span {
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
    background: linear-gradient(to top, var(--red) var(--p, 0%), transparent var(--p, 0%));
    -webkit-background-clip: text; background-clip: text;
  }
  .meta { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: baseline; font-size: 14px; color: var(--muted); }
  .meta b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }

  /* Brush rack */
  .brushes { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .chip {
    appearance: none; cursor: pointer; font: inherit; text-align: left;
    display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 10px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-top: 5px solid var(--bc, var(--muted)); border-radius: 8px;
    transition: transform .08s, background .12s;
  }
  .chip .t { font-family: var(--display); font-size: 21px; line-height: 1; }
  .chip .n { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] { background: var(--bc); border-color: var(--bc); color: var(--oc, var(--bg)); transform: translateY(-3px); box-shadow: 0 8px 0 -3px rgba(0, 0, 0, .35); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
  .chip.erase { --bc: var(--ink); --oc: var(--bg); }
  .chip:focus-visible, .day:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint { margin: -6px 0 0; font-size: 12.5px; color: var(--muted); }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dow { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); padding-bottom: 2px; }
  .dow.sun { color: var(--red); }

  .day {
    position: relative; aspect-ratio: 1 / 1.05; min-width: 0; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
  }
  .day.blank { background: transparent; border-color: transparent; pointer-events: none; }
  .num {
    position: absolute; top: 4px; left: 4px; z-index: 2;
    display: flex; flex-direction: column; align-items: flex-start; padding: 1px 6px 0; border-radius: 5px;
    font-family: var(--display); font-size: clamp(17px, 4.8vw, 25px); line-height: 1.05; font-variant-numeric: tabular-nums;
  }
  .num i { font-style: normal; font-family: var(--sans); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); line-height: 1.3; }
  .day.filled .num { background: var(--pill); }
  .day.past:not(.filled) .num { color: var(--muted); }
  .day.past::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to top right, transparent calc(50% - 1px), var(--slash) calc(50% - 1px), var(--slash) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .day.past.filled::after {
    background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--slash-fill) calc(50% - 1.5px), var(--slash-fill) calc(50% + 1.5px), transparent calc(50% + 1.5px));
  }
  .day.today { outline: 3px solid var(--ink); outline-offset: 1px; overflow: visible; }
  .day.exam { border: 2px solid var(--red); box-shadow: 0 0 26px var(--glow), inset 0 0 0 1px var(--red); }
  .tag {
    position: absolute; right: 4px; bottom: 4px; z-index: 2; padding: 2px 6px 1px; border-radius: 4px;
    font-family: var(--display); font-size: 13px; line-height: 1.2; letter-spacing: .04em;
    background: var(--ink); color: var(--bg);
  }
  .tag.exam { background: var(--red); color: #fff; font-size: 15px; }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.9); } to { transform: scale(1); } }

  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .chip, .pop { transition: none; animation: none; } }
</style>
<style>html{height:100%}body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span>대학수학능력시험</span><span>11.19 THU</span></div>
    <h1 class="big" id="dday"><span>D-?</span></h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="brushes" id="brushes" role="group" aria-label="칠할 과목"></div>
  <p class="hint">과목을 고르고 날짜를 누르거나 드래그하세요. 같은 과목을 다시 누르면 지워져요.</p>

  <div class="cal" id="cal" aria-label="10월 13일부터 수능까지 달력"></div>

  <div class="foot"><span id="status">불러오는 중</span><span>지난 날은 사선으로 지워져요</span></div>
</div>

<script>
(function () {
  var SUBJ = [
    { id: 'math', name: '수학' }, { id: 'bio', name: '생I' }, { id: 'earth', name: '지I' },
    { id: 'eng', name: '영어' }, { id: 'kor', name: '국어' }
  ];
  var START = new Date(2026, 9, 13), EXAM = new Date(2026, 10, 19);
  var LS = 'suneung-subject-cal-v1', LSB = 'suneung-subject-brush-v1';
  var DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

  var state = {};
  var brush = 'math';
  var cells = {};
  var dragging = false, dragAction = null;
  var dbDoc = null, saving = false, queued = false, saveTimer = null;

  function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function today0() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  try { var s = localStorage.getItem(LS); if (s) state = JSON.parse(s) || {}; } catch (e) {}
  try { var b = localStorage.getItem(LSB); if (b) brush = b; } catch (e) {}

  /* D-day header: the number fills red from the bottom as days pass */
  function paintDday() {
    var diff = Math.round((EXAM - today0()) / 864e5);
    var total = Math.round((EXAM - START) / 864e5);
    var p = Math.max(0, Math.min(1, (total - diff) / total));
    var t = diff > 0 ? 'D-' + diff : diff === 0 ? 'D-DAY' : 'D+' + (-diff);
    var big = document.getElementById('dday');
    big.firstChild.textContent = t;
    big.firstChild.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    document.getElementById('meta').innerHTML = diff > 0
      ? '<span><b>' + diff + '</b>일 남음</span><span><b>' + Math.round(p * 100) + '%</b>지남</span>'
      : '<span>수고했어요</span>';
  }

  /* Brush chips */
  var brushBox = document.getElementById('brushes');
  var chipEls = {};
  SUBJ.forEach(function (sj) {
    var el = document.createElement('button');
    el.type = 'button'; el.className = 'chip';
    el.style.setProperty('--bc', 'var(--c-' + sj.id + ')');
    el.style.setProperty('--oc', 'var(--on-' + sj.id + ')');
    el.innerHTML = '<span class="t">' + sj.name + '</span><span class="n">0일</span>';
    el.addEventListener('click', function () { setBrush(sj.id); });
    brushBox.appendChild(el); chipEls[sj.id] = el;
  });
  var er = document.createElement('button');
  er.type = 'button'; er.className = 'chip erase';
  er.innerHTML = '<span class="t">지우개</span><span class="n">칸 비우기</span>';
  er.addEventListener('click', function () { setBrush('erase'); });
  brushBox.appendChild(er); chipEls.erase = er;

  function setBrush(id) {
    brush = id;
    try { localStorage.setItem(LSB, id); } catch (e) {}
    Object.keys(chipEls).forEach(function (k) { chipEls[k].setAttribute('aria-pressed', k === id ? 'true' : 'false'); });
  }

  /* Calendar */
  var cal = document.getElementById('cal');
  DOW.forEach(function (n, i) {
    var h = document.createElement('div'); h.className = 'dow' + (i === 0 ? ' sun' : ''); h.textContent = n; cal.appendChild(h);
  });
  function blank() { var d = document.createElement('div'); d.className = 'day blank'; cal.appendChild(d); }
  for (var i = 0; i < START.getDay(); i++) blank();
  var tk = key(today0());
  for (var d = new Date(START); d <= EXAM; d.setDate(d.getDate() + 1)) {
    var k = key(d), el = document.createElement('div');
    var isExam = d.getTime() === EXAM.getTime();
    el.className = 'day' + (isExam ? ' exam' : ''); el.dataset.k = k; el.tabIndex = 0; el.setAttribute('role', 'button');
    var mo = (d.getTime() === START.getTime() || d.getDate() === 1) ? '<i>' + (d.getMonth() + 1) + '월</i>' : '';
    var html = '<span class="num">' + mo + '<span>' + d.getDate() + '</span></span>';
    if (isExam) html += '<span class="tag exam">수능</span>';
    el.innerHTML = html;
    if (k === tk) { el.classList.add('today'); if (!isExam) el.insertAdjacentHTML('beforeend', '<span class="tag">TODAY</span>'); }
    else if (k < tk) el.classList.add('past');
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apply(e.currentTarget, null); commit(); }
    });
    cal.appendChild(el); cells[k] = el;
  }
  while ((cal.children.length - 7) % 7 !== 0) blank();

  function nm(id) { for (var i = 0; i < SUBJ.length; i++) if (SUBJ[i].id === id) return SUBJ[i].name; return id; }
  function order(id) { for (var i = 0; i < SUBJ.length; i++) if (SUBJ[i].id === id) return i; return 99; }

  function paintCell(k) {
    var el = cells[k], list = (state[k] || []);
    el.setAttribute('aria-label', k + ' ' + (list.length ? list.map(nm).join(', ') : '기록 없음'));
    if (!list.length) { el.style.background = ''; el.classList.remove('filled'); return; }
    el.classList.add('filled');
    if (list.length === 1) { el.style.background = 'var(--c-' + list[0] + ')'; return; }
    var step = 100 / list.length, parts = list.map(function (id, i) {
      return 'var(--c-' + id + ') ' + (i * step).toFixed(2) + '% ' + ((i + 1) * step).toFixed(2) + '%';
    });
    el.style.background = 'linear-gradient(135deg,' + parts.join(',') + ')';
  }
  function bump(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  function paintAll() {
    Object.keys(cells).forEach(paintCell);
    SUBJ.forEach(function (sj) {
      var n = 0;
      Object.keys(state).forEach(function (k) { if (cells[k] && state[k].indexOf(sj.id) >= 0) n++; });
      chipEls[sj.id].querySelector('.n').textContent = n + '일';
    });
  }

  /* Painting */
  function apply(el, action) {
    var k = el.dataset.k, list = (state[k] || []).slice();
    if (brush === 'erase') { if (!list.length) return action || 'remove'; delete state[k]; paintCell(k); bump(el); return 'remove'; }
    var has = list.indexOf(brush) >= 0;
    var act = action || (has ? 'remove' : 'add');
    if (act === 'add' && !has) list.push(brush);
    else if (act === 'remove' && has) list.splice(list.indexOf(brush), 1);
    else return act;
    list.sort(function (a, b) { return order(a) - order(b); });
    if (list.length) state[k] = list; else delete state[k];
    paintCell(k); bump(el);
    return act;
  }

  cal.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.day[data-k]'); if (!el) return;
    e.preventDefault(); dragging = true; dragAction = apply(el, null);
  });
  cal.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var t = document.elementFromPoint(e.clientX, e.clientY), el = t && t.closest ? t.closest('.day[data-k]') : null;
    if (el) apply(el, dragAction);
  });
  function end() { if (!dragging) return; dragging = false; dragAction = null; commit(); }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  /* Saving */
  function setStatus(t) { document.getElementById('status').textContent = t; }
  function commit() {
    paintAll();
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (!dbDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }
  function flush() {
    saveTimer = null;
    if (saving) { queued = true; return; }
    saving = true; setStatus('저장 중');
    dbDoc.set({ days: JSON.parse(JSON.stringify(state)) }).then(function () {
      setStatus('저장됨');
    }, function () {
      setStatus('이 기기에만 저장됨');
    }).then(function () {
      saving = false;
      if (queued) { queued = false; flush(); }
    });
  }

  setBrush(brush); paintDday(); paintAll(); setStatus('이 기기에만 저장됨');

  /* Cloud sync (loads after first paint; page works without it) */
  if (window.claude && claude.use) {
    claude.use('db').then(function (db) {
      if (!db) return;
      dbDoc = db.doc('planner/main');
      dbDoc.onSnapshot(function (snap) {
        if (dragging || saving || queued || saveTimer) { setStatus('저장됨'); return; }
        if (snap.exists) {
          var days = (snap.data() || {}).days;
          if (days && JSON.stringify(days) !== JSON.stringify(state)) {
            state = days;
            try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
            paintAll();
          }
        }
        setStatus('저장됨');
      }, function () { setStatus('이 기기에만 저장됨'); });
    }, function () {});
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) paintDday(); });
})();
</script>
</body>
</html>
